[project]
name = "eco-agent-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "openai>=3.17.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "sql>=2022.4.0",
    "sqlalchemy>=2.0.54",
    "sqlglot>=30.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_agent_os"]
