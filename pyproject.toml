[project]
name = "eco-agent-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.140.8",
    "greenlet>=3.5.6",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.17.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "sql>=2022.4.0",
    "sqlalchemy>=2.0.54",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"  # 新增：自动识别所有 async def 测试用例
markers = [
    "integration: tests that require external infrastructure such as PostgreSQL",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_agent_os"]

[tool.ruff]
target-version = "py311"
line-length = 88

extend-exclude = [
    ".venv",
    "evals/reports",
]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


